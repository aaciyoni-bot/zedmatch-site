    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

</head>
<body class="bg-rose-50 font-sans text-slate-800 min-h-screen">

    <!-- ═══ ORIZIS INTRO · standalone module ═══ -->
    <div id="orizis-intro">
      <style>
        #orizis-intro { position: fixed; inset: 0; z-index: 999999; background: #0d0510; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.45s ease; }
        #orizis-intro.oi-out { opacity: 0; pointer-events: none; }
        #orizis-intro .oi-mark { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: clamp(38px, 9vw, 72px); letter-spacing: 0.22em; margin-right: -0.22em; background: linear-gradient(100deg, #881337 0%, #ffe4e6 28%, #e3ae4e 50%, #ffe4e6 72%, #881337 100%); background-size: 240% auto; -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0; animation: oiShine 1.9s ease forwards, oiRise 0.9s cubic-bezier(0.22,1,0.36,1) forwards; }
        #orizis-intro .oi-sub { font-family: 'Inter', Arial, sans-serif; font-weight: 700; font-size: clamp(10px, 2.2vw, 14px); letter-spacing: 0.55em; margin-right: -0.55em; color: #9d5b7e; margin-top: 14px; opacity: 0; animation: oiFade 0.7s ease 0.55s forwards; }
        #orizis-intro .oi-line { width: 0; height: 1px; background: linear-gradient(90deg, transparent, #e3ae4e, transparent); margin-top: 22px; animation: oiLine 1.1s ease 0.35s forwards; }
        #orizis-intro .oi-load { display: flex; align-items: center; gap: 8px; margin-top: 26px; color: #9d5b7e; font-family: 'Inter', Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.2em; opacity: 0; animation: oiFade 0.7s ease 0.9s forwards; }
        #orizis-intro .oi-spin { width: 14px; height: 14px; border: 2px solid rgba(227,174,78,0.25); border-top-color: #e3ae4e; border-radius: 50%; animation: oiSpin 0.9s linear infinite; }
        @keyframes oiSpin { to { transform: rotate(360deg); } }
        @keyframes oiShine { from { background-position: 200% center; } to { background-position: -40% center; } }
        @keyframes oiRise { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
        @keyframes oiFade { to { opacity: 1; } }
        @keyframes oiLine { to { width: min(320px, 60vw); } }
      </style>
      <div class="oi-mark">ORIZIS</div>
      <div class="oi-line"></div>
      <div class="oi-sub">TECHNOLOGY</div>
      <div class="oi-load"><div class="oi-spin"></div>LOADING</div>
      <script>
        (function () {
          var el = document.getElementById('orizis-intro');
          var done = false;
          function out() { if (done) return; done = true; el.classList.add('oi-out'); setTimeout(function () { el.remove(); }, 500); }
          el.addEventListener('click', out);
          el.addEventListener('touchstart', out, { passive: true });
          setTimeout(out, 1300);
        })();
      </script>
    </div>
    <!-- ═══ /ORIZIS INTRO ═══ -->

    <!-- App mounts here -->
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white relative shadow-xl overflow-hidden"></div>

    <!-- ======================= TOAST ======================= -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-semibold px-5 py-3 rounded-full shadow-xl z-[70] hidden text-center max-w-[90%]"></div>

<style>
    .swipe-card { touch-action: pan-y; will-change: transform; }
    .stamp { position: absolute; top: 34px; padding: 6px 16px; border: 4px solid; border-radius: 12px; font-weight: 900; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; opacity: 0; transform: rotate(-14deg); pointer-events: none; }
    .stamp-like { left: 20px; color: #22c55e; border-color: #22c55e; transform: rotate(-18deg); }
    .stamp-nope { right: 20px; color: #ef4444; border-color: #ef4444; transform: rotate(18deg); }
    .stamp-super { left: 50%; top: auto; bottom: 90px; transform: translateX(-50%) rotate(-8deg); color: #3b82f6; border-color: #3b82f6; }
    .interest-chip { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,.16); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 9999px; padding: 4px 11px; font-size: 12px; font-weight: 600; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; color: #94a3b8; font-size: 10px; font-weight: 700; transition: color .15s; }
    .tab-btn.active { color: #e11d48; }
    .tab-btn i { font-size: 20px; }
    .pref-chip { padding: 7px 16px; border-radius: 9999px; border: 2px solid #fecdd3; font-weight: 700; font-size: 13px; color: #be123c; transition: all .15s; cursor: pointer; }
    .pref-chip.on { background: #e11d48; color: #fff; border-color: #e11d48; }
    .msg-in { background: #f1f5f9; color: #0f172a; border-radius: 18px 18px 18px 4px; }
    .msg-out { background: linear-gradient(135deg,#f43f5e,#e11d48); color: #fff; border-radius: 18px 18px 4px 18px; }
    @keyframes heartPop { 0%{transform:scale(0);opacity:0} 50%{transform:scale(1.25);opacity:1} 100%{transform:scale(1);opacity:1} }
    .heart-pop { animation: heartPop .5s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes floatUp { from{transform:translateY(0);opacity:.9} to{transform:translateY(-120px);opacity:0} }
</style>

<script>
/* ================================================================
   ZEDMATCH CONFIG — edit these values
   ================================================================ */
const CONFIG = {
    APP_NAME: "ZedMatch",
    // Backend (Vercel server.js) that runs pawaPay Mobile Money.
    // Leave "" to force full DEMO mode (payments simulated locally).
    API_BASE_URL: "",

    // Support contact (business number — never a private phone).
    WHATSAPP_SUPPORT: "260971234567",

    // Pilot cities — launch hyper-local. Keep this short at first (one city).
    CITIES: ["Lusaka", "Ndola", "Kitwe", "Livingstone", "Kabwe", "Chingola"],

    MIN_AGE: 18,

    // Free tier limit — number of right-swipes (likes) per day before paywall.
    FREE_SWIPES_PER_DAY: 15,

    // Prices in Zambian Kwacha (ZMW). Paid features unlock ONLY after a
    // server-verified payment (see unlockAfterPayment()).
    PRICES: {
        premium_month: 79,   // ZedMatch Premium — 30 days
        who_liked:     29,   // see everyone who liked you
        boost:         19,   // 30-min boost, be seen first
        superlike_5:   15    // pack of 5 Super Likes
    },

    // Admin access: profiles whose id/email is listed here see the moderation queue.
    // In production, enforce this with Firestore rules + custom claims, NOT just here.
    ADMIN_IDS: ["admin"]
};

/* ================================================================
   FIREBASE (optional) — fill in to go live with real accounts.
   While these stay blank, ZedMatch runs in DEMO mode using
   localStorage + seeded profiles, so the whole flow is testable.
   ================================================================ */
const FIREBASE_CONFIG = {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
};
const FIREBASE_ON = false; // set true after filling FIREBASE_CONFIG (see SETUP.md)

/* ================================================================
   SEED PROFILES — used in DEMO mode so the swipe deck isn't empty.
   These are illustrative demo personas, not real people.
   ================================================================ */
const SEED = [
    { id:'s1', name:'Chanda', age:24, gender:'f', city:'Lusaka', verified:true, bio:'Nurse who loves nshima, gospel music and long drives. Looking for something real. 🙏', interests:['Music','Cooking','Church','Travel'], likesYou:true, photos:['https://picsum.photos/seed/zm-cf1/600/800','https://picsum.photos/seed/zm-cf1b/600/800'] },
    { id:'s2', name:'Mutinta', age:27, gender:'f', city:'Lusaka', verified:true, bio:'Entrepreneur. I run a small salon in Kabulonga. Coffee, ambition and good vibes.', interests:['Business','Coffee','Fashion','Gym'], likesYou:false, photos:['https://picsum.photos/seed/zm-cf2/600/800'] },
    { id:'s3', name:'Natasha', age:22, gender:'f', city:'Ndola', verified:false, bio:'UNZA student 📚. Netball on weekends. Make me laugh and you win.', interests:['Netball','Movies','Reading'], likesYou:true, photos:['https://picsum.photos/seed/zm-cf3/600/800'] },
    { id:'s4', name:'Bupe', age:29, gender:'f', city:'Kitwe', verified:true, bio:'Accountant, foodie, and a proud auntie. No games, just genuine connection.', interests:['Food','Family','Music','Travel'], likesYou:false, photos:['https://picsum.photos/seed/zm-cf4/600/800'] },
    { id:'s5', name:'Temwani', age:25, gender:'f', city:'Lusaka', verified:true, bio:'Teacher 🍎 Love sunsets at Kalimba, hiking and afrobeats.', interests:['Teaching','Hiking','Afrobeats','Nature'], likesYou:true, photos:['https://picsum.photos/seed/zm-cf5/600/800'] },
    { id:'m1', name:'Mwamba', age:28, gender:'m', city:'Lusaka', verified:true, bio:'Engineer at heart, footballer on weekends ⚽. Family man in the making.', interests:['Football','Cars','Tech','Family'], likesYou:true, photos:['https://picsum.photos/seed/zm-cm1/600/800'] },
    { id:'m2', name:'Kunda', age:31, gender:'m', city:'Lusaka', verified:true, bio:'Doctor. I value honesty, faith and a good sense of humour. Let\'s talk.', interests:['Medicine','Church','Reading','Chess'], likesYou:false, photos:['https://picsum.photos/seed/zm-cm2/600/800'] },
    { id:'m3', name:'Chibwe', age:26, gender:'m', city:'Ndola', verified:false, bio:'Music producer 🎧 Copperbelt born. Ambitious and loyal.', interests:['Music','Production','Gym','Travel'], likesYou:true, photos:['https://picsum.photos/seed/zm-cm3/600/800'] },
    { id:'m4', name:'Lubinda', age:30, gender:'m', city:'Livingstone', verified:true, bio:'Tour guide by the Falls 🌊 Adventurous, calm, and a great cook.', interests:['Adventure','Cooking','Nature','Photography'], likesYou:false, photos:['https://picsum.photos/seed/zm-cm4/600/800'] },
    { id:'m5', name:'Taonga', age:27, gender:'m', city:'Kitwe', verified:true, bio:'Banker who loves braais, church and a good conversation. Serious dating only.', interests:['Finance','Braai','Church','Fitness'], likesYou:true, photos:['https://picsum.photos/seed/zm-cm5/600/800'] }
];

const INTEREST_OPTIONS = ['Music','Movies','Travel','Cooking','Church','Gym','Football','Netball','Fashion','Business','Reading','Photography','Nature','Coffee','Family','Afrobeats','Gospel','Dancing','Food','Tech'];

/* ================================================================
   STATE + STORAGE
   ================================================================ */
const $ = id => document.getElementById(id);
const app = $('app');
let me = null;                 // current user profile
let pool = [];                 // swipe candidates
let deckIndex = 0;
let matches = [];              // [{id, profile, messages:[{from,text,at}]}]
let reports = [];              // moderation queue (demo/local)
let activeTab = 'discover';
let activeChatId = null;

const DB = {
    load(k, d) { try { return JSON.parse(localStorage.getItem('zedmatch_' + k)) ?? d; } catch { return d; } },
    save(k, v) { localStorage.setItem('zedmatch_' + k, JSON.stringify(v)); }
};

function todayStr() {
    // Local date key for the daily free-swipe reset
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function freshUser() {
    return {
        id: 'me_' + Math.random().toString(36).slice(2, 9),
        name: '', age: null, gender: '', seeking: '', city: CONFIG.CITIES[0],
        bio: '', interests: [], photos: [], selfie: null,
        verified: false, verifyStatus: 'none', // none | pending | approved | rejected
        premium: false, premiumUntil: 0,
        superLikes: 1, boostUntil: 0,
        swipesToday: 0, swipeDate: todayStr(),
        likedIds: [], passedIds: [], superLikedIds: [], blockedIds: [],
        ageConfirmed: false, agreedTerms: false
    };
}

function showToast(msg, ms) {
    const t = $('toast');
    t.innerHTML = msg;
    t.classList.remove('hidden');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.add('hidden'), ms || 2600);
}

/* ================================================================
   BOOT
   ================================================================ */
function boot() {
    me = DB.load('me', null);
    matches = DB.load('matches', []);
    reports = DB.load('reports', []);

    // Daily free-swipe reset
    if (me && me.swipeDate !== todayStr()) { me.swipeDate = todayStr(); me.swipesToday = 0; saveMe(); }
    // Premium expiry
    if (me && me.premium && me.premiumUntil && Date.now() > me.premiumUntil) { me.premium = false; saveMe(); }

    if (!me || !me.ageConfirmed) return renderAgeGate();
    if (!me.name || !me.gender || !me.photos.length) return renderOnboarding();
    renderHome();
}
function saveMe() { DB.save('me', me); }
function saveMatches() { DB.save('matches', matches); }
function saveReports() { DB.save('reports', reports); }

/* ================================================================
   1) AGE GATE (18+) — legal / safety requirement
   ================================================================ */
function renderAgeGate() {
    app.innerHTML = `
    <div class="min-h-screen flex flex-col items-center justify-center px-7 text-center bg-gradient-to-br from-rose-600 via-rose-700 to-[#3b0618] text-white">
        <div class="text-6xl heart-pop"><i class="fas fa-heart"></i></div>
        <h1 class="mt-5 text-4xl font-display font-extrabold">Zed<span class="text-gold-soft">Match</span></h1>
        <p class="mt-2 text-rose-100/90 text-sm">Meet someone real in Zambia 🇿🇲</p>

        <div class="mt-10 bg-white/10 backdrop-blur border border-white/15 rounded-2xl p-6 w-full">
            <div class="text-3xl text-gold-soft"><i class="fas fa-shield-halved"></i></div>
            <h2 class="mt-3 font-extrabold text-lg">Are you 18 or older?</h2>
            <p class="mt-2 text-rose-100/80 text-sm">ZedMatch is strictly for adults. You must be at least ${CONFIG.MIN_AGE} to use this app.</p>
            <button onclick="confirmAge()" class="mt-5 w-full bg-white text-rose-700 font-extrabold py-3.5 rounded-full hover:bg-rose-50 transition">Yes, I'm 18 or older</button>
            <button onclick="denyAge()" class="mt-2 w-full text-rose-100/80 text-sm py-2 hover:text-white">No, I'm under 18</button>
        </div>
        <p class="mt-6 text-[11px] text-rose-100/60 leading-relaxed max-w-xs">By continuing you agree to our <b>Terms</b> &amp; <b>Community Rules</b> and confirm your details are truthful. Fake or underage profiles are removed.</p>
        <p class="mt-3 text-[10px] text-rose-100/40">an ORIZIS TECHNOLOGY product</p>
    </div>`;
}
function confirmAge() {
    if (!me) me = freshUser();
    me.ageConfirmed = true; me.agreedTerms = true; saveMe();
    renderOnboarding();
}
function denyAge() {
    app.innerHTML = `<div class="min-h-screen flex flex-col items-center justify-center px-8 text-center bg-slate-900 text-white">
        <div class="text-5xl text-rose-400"><i class="fas fa-circle-info"></i></div>
        <h2 class="mt-4 font-bold text-xl">Sorry — you must be 18+</h2>
        <p class="mt-2 text-slate-400 text-sm">ZedMatch is an adults-only dating app. Please come back when you're 18.</p>
    </div>`;
}

/* ================================================================
   2) ONBOARDING — build profile + selfie verification
   ================================================================ */
let onbStep = 0;
function renderOnboarding() {
    if (!me) me = freshUser();
    const steps = [onbBasics, onbPhotos, onbAbout, onbVerify];
    onbStep = Math.min(onbStep, steps.length - 1);
    steps[onbStep]();
}
function onbShell(title, sub, body, footer) {
    app.innerHTML = `
    <div class="min-h-screen flex flex-col bg-white">
        <div class="px-6 pt-8 pb-4">
            <div class="flex gap-1.5 mb-6">
                ${[0,1,2,3].map(i => `<div class="h-1.5 flex-1 rounded-full ${i<=onbStep?'bg-rose-600':'bg-rose-100'}"></div>`).join('')}
            </div>
            <h1 class="text-2xl font-display font-extrabold">${title}</h1>
            <p class="text-slate-500 text-sm mt-1">${sub}</p>
        </div>
        <div class="flex-1 overflow-y-auto px-6 no-scrollbar">${body}</div>
        <div class="p-6 border-t bg-white">${footer}</div>
    </div>`;
}
function onbBasics() {
    onbShell('First, the basics', 'This is how you\'ll appear on ZedMatch.',
    `<div class="space-y-5 pb-4">
        <div>
            <label class="text-sm font-bold text-slate-600 block mb-1.5">Your first name</label>
            <input id="onbName" value="${me.name||''}" placeholder="e.g. Chanda" maxlength="20" class="w-full border-2 border-rose-100 focus:border-rose-500 rounded-xl px-4 py-3 outline-none">
        </div>
        <div>
            <label class="text-sm font-bold text-slate-600 block mb-1.5">Your age</label>
            <input id="onbAge" value="${me.age||''}" type="number" min="18" max="99" placeholder="18+" class="w-full border-2 border-rose-100 focus:border-rose-500 rounded-xl px-4 py-3 outline-none" oninput="this.value=this.value.slice(0,2)">
        </div>
        <div>
            <label class="text-sm font-bold text-slate-600 block mb-2">I am a</label>
            <div class="flex gap-2">
                <div class="pref-chip flex-1 text-center ${me.gender==='m'?'on':''}" onclick="setGender('m')"><i class="fas fa-mars mr-1"></i>Man</div>
                <div class="pref-chip flex-1 text-center ${me.gender==='f'?'on':''}" onclick="setGender('f')"><i class="fas fa-venus mr-1"></i>Woman</div>
            </div>
        </div>
        <div>
            <label class="text-sm font-bold text-slate-600 block mb-2">Your city</label>
            <select id="onbCity" class="w-full border-2 border-rose-100 focus:border-rose-500 rounded-xl px-4 py-3 outline-none bg-white">
                ${CONFIG.CITIES.map(c => `<option ${me.city===c?'selected':''}>${c}</option>`).join('')}
            </select>
            <p class="text-[11px] text-slate-400 mt-1.5"><i class="fas fa-lock mr-1"></i>Only your city is ever shown — never your exact location.</p>
        </div>
    </div>`,
    `<button onclick="saveBasics()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-extrabold py-3.5 rounded-full transition">Continue</button>`);
}
function setGender(g) { me.gender = g; me.seeking = g === 'm' ? 'f' : 'm'; onbBasics(); }
function saveBasics() {
    const name = $('onbName').value.trim();
    const age = parseInt($('onbAge').value);
    if (!name) return showToast('Please enter your name');
    if (!age || age < CONFIG.MIN_AGE) return showToast('You must be 18 or older');
    if (!me.gender) return showToast('Please select if you are a man or woman');
    me.name = name; me.age = age; me.city = $('onbCity').value;
    // Hetero-only pilot: seeking is the opposite gender (set in setGender)
    me.seeking = me.gender === 'm' ? 'f' : 'm';
    saveMe(); onbStep = 1; renderOnboarding();
}
function onbPhotos() {
    onbShell('Add your photos', 'Real, clear photos get 3× more matches. Add at least one.',
    `<div class="grid grid-cols-3 gap-3 pb-4">
        ${[0,1,2,3,4,5].map(i => {
            const p = me.photos[i];
            return p
              ? `<div class="relative aspect-[3/4] rounded-xl overflow-hidden bg-rose-50">
                   <img src="${p}" class="w-full h-full object-cover">
                   <button onclick="removePhoto(${i})" class="absolute top-1 right-1 bg-black/60 text-white w-6 h-6 rounded-full text-xs"><i class="fas fa-xmark"></i></button>
                 </div>`
              : `<button onclick="addPhoto()" class="aspect-[3/4] rounded-xl border-2 border-dashed border-rose-200 text-rose-300 flex items-center justify-center hover:border-rose-400 hover:text-rose-400"><i class="fas fa-plus text-xl"></i></button>`;
        }).join('')}
    </div>
    <p class="text-[11px] text-slate-400"><i class="fas fa-circle-info mr-1"></i>Demo mode uses sample images. On the live app you'll upload from your phone.</p>`,
    `<button onclick="savePhotos()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-extrabold py-3.5 rounded-full transition">Continue</button>`);
}
function addPhoto() {
    if (me.photos.length >= 6) return;
    // DEMO: seed a sample image. LIVE: replace with Firebase Storage upload.
    const seed = 'zm-me-' + me.id + '-' + me.photos.length + '-' + Math.floor(Math.random()*9999);
    me.photos.push('https://picsum.photos/seed/' + seed + '/600/800');
    saveMe(); onbPhotos();
}
function removePhoto(i) { me.photos.splice(i,1); saveMe(); onbPhotos(); }
function savePhotos() {
    if (!me.photos.length) return showToast('Add at least one photo');
    saveMe(); onbStep = 2; renderOnboarding();
}
function onbAbout() {
    onbShell('Tell us about you', 'A short bio and your interests help you match with the right people.',
    `<div class="space-y-5 pb-4">
        <div>
            <label class="text-sm font-bold text-slate-600 block mb-1.5">Your bio</label>

/* ================================================================

   ================================================================ */
function buildPool() {
    const seen = new Set([...me.likedIds, ...me.passedIds, ...me.superLikedIds, ...me.blockedIds]);
    pool = SEED.filter(p =>
        p.gender === me.seeking &&        // enforce opposite-gender matching
        p.gender !== me.gender &&
        !seen.has(p.id)
    );
    // Boosted / verified users float up a bit
    pool.sort((a,b) => (b.verified?1:0) - (a.verified?1:0));
    deckIndex = 0;
}

    </div>`;

function attachSwipe(el, card) {
    if (!el) return;
    let startX=0, startY=0, dx=0, dy=0, dragging=false;
    const like = el.querySelector('.stamp-like'), nope = el.querySelector('.stamp-nope');
    const start = (x,y) => { dragging=true; startX=x; startY=y; el.style.transition='none'; };
    const move = (x,y) => {
        if (!dragging) return;
        dx = x-startX; dy = y-startY;
        el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx*0.06}deg)`;
        if (like) like.style.opacity = Math.max(0, Math.min(1, dx/90));
        if (nope) nope.style.opacity = Math.max(0, Math.min(1, -dx/90));
    };
    const end = () => {
        if (!dragging) return; dragging=false;
        el.style.transition='transform .3s ease';
        if (dx > 100) { flyOut(el, 1); doSwipe(card, 'like'); }
        else if (dx < -100) { flyOut(el, -1); doSwipe(card, 'nope'); }
        else { el.style.transform=''; if(like)like.style.opacity=0; if(nope)nope.style.opacity=0; }
    };
    el.addEventListener('touchstart', e=>start(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
    el.addEventListener('touchmove', e=>move(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', e=>start(e.clientX,e.clientY));
    window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
    window.addEventListener('mouseup', end);
}
function flyOut(el, dir) {
    el.style.transition='transform .35s ease, opacity .35s ease';
    el.style.transform = `translate(${dir*600}px, -40px) rotate(${dir*30}deg)`;
    el.style.opacity = '0';
}
function swipeBtn(action) {
    const card = pool[deckIndex];
    if (!card) return;
    const el = $('deck').querySelector('.swipe-card:last-child');
    if (el) {
        const stamp = el.querySelector(action==='like'?'.stamp-like':action==='nope'?'.stamp-nope':'.stamp-super');
        if (stamp) stamp.style.opacity = '1';
        flyOut(el, action==='nope'?-1:1);
    }
    doSwipe(card, action);
}
function doSwipe(card, action) {
    // Free-swipe gate applies to right-swipes (like / super)
    if ((action==='like'||action==='super') && !me.premium) {
        if (me.swipesToday >= CONFIG.FREE_SWIPES_PER_DAY) {
            // revert card position
            renderDeck();
            return openPaywall('swipes');
        }
    }
    if (action==='super') {
        if (me.superLikes <= 0 && !me.premium) { renderDeck(); return openPaywall('superlike'); }
        if (!me.premium) me.superLikes--;
        me.superLikedIds.push(card.id);
    }
    if (action==='like'||action==='super') { me.likedIds.push(card.id); me.swipesToday++; }
    else me.passedIds.push(card.id);
    saveMe();

    const matched = (action==='like'||action==='super') && card.likesYou;
    deckIndex++;
    setTimeout(() => {
        renderDeck();
        // update the "likes left" counter
        const t = $('screen'); if (t && activeTab==='discover') { /* light refresh */ }
        renderDiscover($('screen'));
        if (matched) showMatch(card);
    }, 260);
}

let _net = null;
function pickNet(n, el) { _net=n; document.querySelectorAll('.net-btn').forEach(b=>b.style.borderColor=''); el.style.borderColor='#198a00'; }
async function submitPay(sku, amount) {
    const phone = ($('payPhone').value||'').trim();
    const err = $('payErr');
    if (!_net) { err.textContent='Please choose your network'; err.classList.remove('hidden'); return; }
    if (!/^(9|7)\d{8}$/.test(phone)) { err.textContent='Enter a valid 9-digit number (e.g. 97 1234567)'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    $('payS1').classList.add('hidden'); $('payS2').classList.remove('hidden');

    // Server-verified payment. In DEMO (no API_BASE_URL) we simulate success.
    try {
        if (!CONFIG.API_BASE_URL) {
            await new Promise(r=>setTimeout(r, 2600));
            return finalizePay(sku, amount);
        }
        const base = CONFIG.API_BASE_URL.replace(/\/$/,'');
        const r = await fetch(base+'/api/pay', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone, network:_net, amount, item: sku }) });
        const d = await r.json();
        if (d.simulated) { await new Promise(x=>setTimeout(x,2200)); return finalizePay(sku, amount); }
        // Poll status — unlock ONLY on server-confirmed success
        const txr = d.tx_ref;
        for (let i=0;i<20;i++) {
            await new Promise(x=>setTimeout(x,3000));
            const s = await (await fetch(base+'/api/pay/status?tx_ref='+encodeURIComponent(txr))).json();
            if (s.status==='successful') return finalizePay(sku, amount);
            if (s.status==='failed') return payFailed();
        }
        payFailed();
    } catch(e) { payFailed(); }
}
function payFailed() {
    const m = $('payModal'); if (m) m.remove();
    showToast('Payment not completed. Please try again.', 3000);
}
function finalizePay(sku, amount) {
    unlockAfterPayment(sku);
    const m = $('payModal'); if (m) m.remove();
    // success flash
    const ov = document.createElement('div');
    ov.className='fixed inset-0 z-[95] bg-zam-green/95 flex flex-col items-center justify-center text-white fade-in';
    ov.innerHTML = `<div class="w-24 h-24 rounded-full bg-white flex items-center justify-center heart-pop"><i class="fas fa-check text-zam-green text-4xl"></i></div>
        <h2 class="text-2xl font-extrabold mt-5">Payment confirmed! 🎉</h2>
        <p class="text-emerald-50 mt-1">Your ${sku==='premium_month'?'Premium':''} feature is now unlocked.</p>`;
    document.body.appendChild(ov);
    setTimeout(()=>{ ov.remove(); renderHome(); }, 1800);
}

                </div>`).join('')}
        </div>
        <p class="text-[11px] text-slate-400 bg-rose-50 rounded-xl p-3"><i class="fas fa-circle-info mr-1"></i>Demo queue (local). In production this reads Firestore <b>reports</b> &amp; <b>verifications</b>, protected by admin-only security rules.</p>
    </div>`;
}
function modAction(i, action) {
    const r = reports[i]; if (!r) return;
    if (action==='ban') { r.status='removed'; showToast('User removed'); }
    else if (action==='dismiss') { r.status='dismissed'; }
    else if (action==='approve') { r.status='approved'; if(r.userId===me.id){me.verified=true;me.verifyStatus='approved';saveMe();} }
    else if (action==='reject') { r.status='rejected'; if(r.userId===me.id){me.verifyStatus='rejected';saveMe();} }
    saveReports(); renderAdmin($('screen'));
}

/* ================================================================
   SERVICE WORKER
   ================================================================ */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

boot();
</script>
