/* ================================================================
   FIREBASE ADAPTER (real backend, cross-device). Every call is guarded
   and falls back to DEMO on any error, so the app always works. Real
   Firestore profiles drive real swipe→match→chat; SEED demo profiles
   keep the deck full during cold-start.
   ================================================================ */
const FB = { on:false, uid:null, db:null, fs:null, msgUnsub:null };

async function fbInit() {
    if (!FIREBASE_ON || !FIREBASE_CONFIG.apiKey) return false;
    try {
        const [appMod, authMod, fsMod] = await Promise.all([
            import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
            import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
            import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
        ]);
        const app = appMod.initializeApp(FIREBASE_CONFIG);
        const auth = authMod.getAuth(app);
        FB.fs = fsMod;
        FB.db = fsMod.getFirestore(app);
        await new Promise((resolve, reject) => {
            const t = setTimeout(() => reject(new Error('auth timeout')), 12000);
            authMod.onAuthStateChanged(auth, u => { if (u) { FB.uid = u.uid; clearTimeout(t); resolve(); } });
            authMod.signInAnonymously(auth).catch(reject);
        });
        FB.on = true;
        return true;
    } catch (e) {
        console.warn('Firebase unavailable → DEMO mode:', e && e.message);
        FB.on = false;
        return false;
    }
}

// Persist my profile (only once it's a real 18+ profile, to satisfy rules).
async function fbSaveProfile() {
    if (!FB.on || !me || !me.name || !(me.age >= 18)) return;
    try {
        const { doc, setDoc } = FB.fs;
        await setDoc(doc(FB.db, 'profiles', FB.uid), {
            id: FB.uid, name: me.name, age: me.age, gender: me.gender, seeking: me.seeking,
            city: me.city, bio: me.bio || '', interests: me.interests || [], photos: me.photos || [],
            verified: !!me.verified, verifyStatus: me.verifyStatus || 'none', active: true, updatedAt: Date.now()
        }, { merge: true });
    } catch (e) { console.warn('fbSaveProfile', e && e.message); }
}

async function fbLoadProfile() {
    if (!FB.on) return null;
    try {
        const { doc, getDoc } = FB.fs;
        const s = await getDoc(doc(FB.db, 'profiles', FB.uid));
        return s.exists() ? s.data() : null;
    } catch (e) { return null; }
}

// Load real opposite-gender candidates from Firestore.
async function fbLoadPool() {
    if (!FB.on || !me) return [];
    try {
        const { collection, query, where, limit, getDocs } = FB.fs;
        const snap = await getDocs(query(collection(FB.db, 'profiles'), where('gender', '==', me.seeking), limit(60)));
        const seen = new Set([...me.likedIds, ...me.passedIds, ...me.superLikedIds, ...me.blockedIds, FB.uid]);
        const out = [];
        snap.forEach(d => {
            const p = d.data();
            if (d.id === FB.uid || seen.has(d.id) || !p.name || !(p.photos && p.photos.length)) return;
            out.push({ id: d.id, name: p.name, age: p.age, gender: p.gender, city: p.city,
                       bio: p.bio || '', interests: p.interests || [], photos: p.photos, verified: !!p.verified, _real: true });
        });
        return out;
    } catch (e) { console.warn('fbLoadPool', e && e.message); return []; }
}

// Record a swipe; on a right-swipe with a reciprocal like, create the match.
// Returns the matched card if this swipe created a match, else null.
async function fbSwipe(card, action) {
    if (!FB.on || !card._real) return null;
    try {
        const { doc, setDoc, getDoc } = FB.fs;
        await setDoc(doc(FB.db, 'swipes', FB.uid + '_' + card.id), { by: FB.uid, target: card.id, action, at: Date.now() });
        if (action === 'nope') return null;
        const recip = await getDoc(doc(FB.db, 'swipes', card.id + '_' + FB.uid));
        if (recip.exists() && ['like','super'].includes(recip.data().action)) {
            const users = [FB.uid, card.id].sort();
            await setDoc(doc(FB.db, 'matches', users.join('_')), {
                users, at: Date.now(),
                profiles: { [FB.uid]: { name: me.name, photo: (me.photos||[])[0] || '' },
                            [card.id]: { name: card.name, photo: (card.photos||[])[0] || '' } }
            }, { merge: true });
            return card;
        }
    } catch (e) { console.warn('fbSwipe', e && e.message); }
    return null;
}

// Real-time listener: merge my matches into the list as they appear.
function fbListenMatches() {
    if (!FB.on) return;
    try {
        const { collection, query, where, onSnapshot } = FB.fs;
        onSnapshot(query(collection(FB.db, 'matches'), where('users', 'array-contains', FB.uid)), snap => {
            let added = false;
            snap.forEach(d => {
                const data = d.data();
                const other = data.users.find(u => u !== FB.uid);
                if (matches.find(m => m.id === other)) return;
                const info = (data.profiles && data.profiles[other]) || {};
                matches.unshift({ id: other, _real: true, matchId: d.id, at: data.at || Date.now(), unread: true, messages: [],
                    profile: { id: other, name: info.name || 'Someone', city: me.city, verified: false,
                               photos: [info.photo || 'https://picsum.photos/seed/' + other + '/600/800'] } });
                added = true;
            });
            if (added) { saveMatches(); if (activeTab === 'matches' && !activeChatId) renderTab(); }
        });
    } catch (e) { console.warn('fbListenMatches', e && e.message); }
}

// Real-time messages for the open chat (sorted client-side — no index needed).
function fbListenMessages(match) {
    if (!FB.on || !match._real) return;
    try {
        const { collection, query, where, onSnapshot } = FB.fs;
        if (FB.msgUnsub) { FB.msgUnsub(); FB.msgUnsub = null; }
        // Query by participants (not matchId): the security rules only allow reads
        // a user can prove they're part of, and this needs no composite index.
        FB.msgUnsub = onSnapshot(query(collection(FB.db, 'messages'), where('participants', 'array-contains', FB.uid)), snap => {
            match.messages = snap.docs.map(d => d.data())
                .filter(m => m.matchId === match.matchId)
                .sort((a, b) => a.at - b.at)
                .map(m => ({ from: m.from === FB.uid ? 'me' : 'them', text: m.text, at: m.at }));
            saveMatches();
            if (activeChatId === match.id) renderChat($('screen'));
        });
    } catch (e) { console.warn('fbListenMessages', e && e.message); }
}

async function fbSendMessage(match, text) {
    if (!FB.on || !match._real) return false;
    try {
        const { collection, addDoc } = FB.fs;
        await addDoc(collection(FB.db, 'messages'), { matchId: match.matchId, from: FB.uid, to: match.id, participants: [FB.uid, match.id], text, at: Date.now() });
        return true;
    } catch (e) { console.warn('fbSendMessage', e && e.message); return false; }
}

// Write to a moderation collection (reports / verifications).
async function fbModeration(coll, data) {
    if (!FB.on) return;
    try { const { collection, addDoc } = FB.fs; await addDoc(collection(FB.db, coll), Object.assign({ by: FB.uid, at: Date.now() }, data)); }
    catch (e) { console.warn('fbModeration ' + coll, e && e.message); }
}

async function boot() {
    app.innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="spinner"></div></div>';
    reports = DB.load('reports', []);
    matches = DB.load('matches', []);

    await fbInit();
    if (FB.on) {
        const prof = await fbLoadProfile();
        const local = DB.load('me', null);
        if (prof) {
            me = Object.assign(freshUser(), local || {}, prof, { id: FB.uid, ageConfirmed: true, agreedTerms: true });
        } else {
            me = local ? Object.assign(local, { id: FB.uid }) : null;
        }
        fbListenMatches();
    } else {
        me = DB.load('me', null);   // DEMO fallback
    }

    // Daily free-swipe reset
    if (me && me.swipeDate !== todayStr()) { me.swipeDate = todayStr(); me.swipesToday = 0; saveMe(); }
    // Premium expiry
    if (me && me.premium && me.premiumUntil && Date.now() > me.premiumUntil) { me.premium = false; saveMe(); }

    if (!me || !me.ageConfirmed) return renderAgeGate();
    if (!me.name || !me.gender || !me.photos.length) return renderOnboarding();
    renderHome();
}

   ================================================================ */
function buildPool() {
    const seen = new Set([...me.likedIds, ...me.passedIds, ...me.superLikedIds, ...me.blockedIds]);
    pool = SEED.filter(p =>
        p.gender === me.seeking &&        // enforce opposite-gender matching
        p.gender !== me.gender &&
        !seen.has(p.id)
    );
    // Boosted / verified users float up a bit
    pool.sort((a,b) => (b.verified?1:0) - (a.verified?1:0));
    deckIndex = 0;
    // Real Firestore profiles load in and go to the front; SEED stays as filler.
    if (FB.on) fbLoadPool().then(real => {
        if (!real || !real.length) return;
        const have = new Set(pool.map(p => p.id));
        pool = real.filter(p => !have.has(p.id)).concat(pool.filter(p => !p._real));
        if (activeTab === 'discover') renderDeck();
    });
}

function attachSwipe(el, card) {
    if (!el) return;
    let startX=0, startY=0, dx=0, dy=0, dragging=false;
    const like = el.querySelector('.stamp-like'), nope = el.querySelector('.stamp-nope');
    const start = (x,y) => { dragging=true; startX=x; startY=y; el.style.transition='none'; };
    const move = (x,y) => {
        if (!dragging) return;
        dx = x-startX; dy = y-startY;
        el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx*0.06}deg)`;
        if (like) like.style.opacity = Math.max(0, Math.min(1, dx/90));
        if (nope) nope.style.opacity = Math.max(0, Math.min(1, -dx/90));
    };
    const end = () => {
        if (!dragging) return; dragging=false;
        el.style.transition='transform .3s ease';
        if (dx > 100) { flyOut(el, 1); doSwipe(card, 'like'); }
        else if (dx < -100) { flyOut(el, -1); doSwipe(card, 'nope'); }
        else { el.style.transform=''; if(like)like.style.opacity=0; if(nope)nope.style.opacity=0; }
    };
    el.addEventListener('touchstart', e=>start(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
    el.addEventListener('touchmove', e=>move(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', e=>start(e.clientX,e.clientY));
    window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
    window.addEventListener('mouseup', end);
}
function flyOut(el, dir) {
    el.style.transition='transform .35s ease, opacity .35s ease';
    el.style.transform = `translate(${dir*600}px, -40px) rotate(${dir*30}deg)`;
    el.style.opacity = '0';
}
function swipeBtn(action) {
    const card = pool[deckIndex];
    if (!card) return;
    const el = $('deck').querySelector('.swipe-card:last-child');
    if (el) {
        const stamp = el.querySelector(action==='like'?'.stamp-like':action==='nope'?'.stamp-nope':'.stamp-super');
        if (stamp) stamp.style.opacity = '1';
        flyOut(el, action==='nope'?-1:1);
    }
    doSwipe(card, action);
}
function doSwipe(card, action) {
    // Free-swipe gate applies to right-swipes (like / super)
    if ((action==='like'||action==='super') && !me.premium) {
        if (me.swipesToday >= CONFIG.FREE_SWIPES_PER_DAY) {
            // revert card position
            renderDeck();
            return openPaywall('swipes');
        }
    }
    if (action==='super') {
        if (me.superLikes <= 0 && !me.premium) { renderDeck(); return openPaywall('superlike'); }
        if (!me.premium) me.superLikes--;
        me.superLikedIds.push(card.id);
    }
    if (action==='like'||action==='super') { me.likedIds.push(card.id); me.swipesToday++; }
    else me.passedIds.push(card.id);
    saveMe();

    deckIndex++;
    const finishUI = () => { renderDeck(); renderDiscover($('screen')); };

    if (FB.on && card._real) {
        // Real profile: server-side mutual-like detection.
        fbSwipe(card, action).then(matchedCard => { if (matchedCard) showMatch(matchedCard); });
        setTimeout(finishUI, 260);
        return;
    }
    // Demo profile: local mutual-like flag.
    const matched = (action==='like'||action==='super') && card.likesYou;
    setTimeout(() => { finishUI(); if (matched) showMatch(card); }, 260);
}
function resetDeckDemo() {
    me.likedIds=[]; me.passedIds=[]; me.superLikedIds=[]; saveMe();

        <a href="https://wa.me/${CONFIG.WHATSAPP_SUPPORT}" target="_blank" rel="noopener" class="mt-5 flex items-center justify-center gap-2 w-full bg-[#25D366] text-white font-bold py-3 rounded-full"><i class="fab fa-whatsapp"></i> Contact Chibwenzi support</a>
        <button onclick="this.closest('.fixed').remove()" class="mt-2 w-full text-slate-400 text-sm py-2">Close</button>
    </div>`;
    document.body.appendChild(ov);
}
function reportUser(id) { reportProfile(id); }
function reportProfile(id) {
    const p = SEED.find(x=>x.id===id) || (matches.find(m=>m.id===id)||{}).profile || {name:'this user', id};
    const reasons = ['Fake profile / catfish','Asking for money / scam','Harassment or abuse','Inappropriate photos','Under 18','Other'];
    const ov = document.createElement('div');
    ov.className='fixed inset-0 z-[85] bg-black/60 flex items-end justify-center';
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    ov.innerHTML = `<div class="bg-white w-full max-w-md rounded-t-3xl p-6 fade-in">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
        <h2 class="text-lg font-extrabold">Report ${p.name}</h2>
        <p class="text-sm text-slate-500 mt-1">Your report is confidential. Serious cases are removed fast.</p>
        <div class="mt-4 space-y-2">
            ${reasons.map(r=>`<button onclick="submitReport('${p.id}','${p.name}','${r.replace(/'/g,'')}')" class="w-full text-left px-4 py-3 bg-cream rounded-xl text-sm font-semibold hover:bg-cream-warm">${r}</button>`).join('')}
        </div>
        <button onclick="this.closest('.fixed').remove()" class="mt-3 w-full text-slate-400 text-sm py-2">Cancel</button>
    </div>`;
    document.body.appendChild(ov);
}
function submitReport(id, name, reason) {
    reports.unshift({ type:'report', targetId:id, targetName:name, reason, by:me.id, at:Date.now(), status:'open' });
    saveReports();
    fbModeration('reports', { targetId: id, targetName: name, reason, status: 'open' });
    // Block + remove from matches immediately
    if (!me.blockedIds.includes(id)) me.blockedIds.push(id);
    matches = matches.filter(m=>m.id!==id);
    saveMe(); saveMatches();
    document.querySelectorAll('.fixed.z-\\[85\\], .fixed.z-\\[75\\]').forEach(x=>x.remove());
    if (activeChatId===id) activeChatId=null;
    buildPool();
    renderHome();
    showToast('Thanks — ' + name + ' was reported &amp; blocked. Our team will review.', 3200);
}

/* ================================================================
   MONETIZATION — paywall + pawaPay (server-verified)
   ================================================================ */
function openPaywall(kind) {
    const P = CONFIG.PRICES;
    // One plan, one price — every entry point sells the same K100 subscription.
    const PERKS = ['Unlimited likes — swipe as much as you want',
                   'See everyone who likes you',
                   'Unlimited Super Likes',
                   'Boost — be seen first in ' + me.city,
                   'Priority support'];
    const plans = {
        premium:   { icon:'crown', title:'Chibwenzi Premium', price:P.premium_month, unit:'/month', perks:PERKS, sku:'premium_month' },
        swipes:    { icon:'heart', title:'Out of free likes', price:P.premium_month, unit:'/month', perks:PERKS, sku:'premium_month', sub:'You\'ve used your ' + CONFIG.FREE_SWIPES_PER_DAY + ' free likes for today.' },
        wholiked:  { icon:'eye',   title:'See who likes you', price:P.premium_month, unit:'/month', perks:PERKS, sku:'premium_month', sub:'Unlock with Chibwenzi Premium.' },
        boost:     { icon:'bolt',  title:'Boost your profile', price:P.premium_month, unit:'/month', perks:PERKS, sku:'premium_month', sub:'Boost is included in Premium.' },
        superlike: { icon:'star',  title:'Super Likes', price:P.premium_month, unit:'/month', perks:PERKS, sku:'premium_month', sub:'Unlimited Super Likes with Premium.' }
    };
    const pl = plans[kind] || plans.premium;
    const ov = document.createElement('div');
    ov.className='fixed inset-0 z-[85] bg-black/60 flex items-end justify-center';
    ov.id='paywall';
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    ov.innerHTML = `<div class="bg-white w-full max-w-md rounded-t-3xl overflow-hidden fade-in">
        <div class="bg-gradient-to-br from-rose-600 to-purple-600 text-white p-6 text-center">
            <div class="text-4xl text-gold-soft"><i class="fas fa-${pl.icon}"></i></div>
            <h2 class="text-xl font-extrabold mt-2">${pl.title}</h2>
            ${pl.sub?`<p class="text-rose-100 text-sm mt-1">${pl.sub}</p>`:''}
        </div>
        <div class="p-6">
            <ul class="space-y-2.5 text-sm">
                ${pl.perks.map(x=>`<li class="flex items-center gap-2.5"><i class="fas fa-circle-check text-ember"></i>${x}</li>`).join('')}
            </ul>
            <div class="mt-5 text-center">
                <span class="text-3xl font-extrabold text-rose-700">K${pl.price}</span><span class="text-slate-400 text-sm">${pl.unit}</span>
            </div>
            <button onclick="payWith('${pl.sku}',${pl.price},'${pl.title.replace(/'/g,'')}')" class="mt-4 w-full bg-zam-green hover:bg-green-800 text-white font-extrabold py-3.5 rounded-full"><i class="fas fa-mobile-screen mr-1"></i>Pay with Mobile Money</button>
            <button onclick="this.closest('.fixed').remove()" class="mt-2 w-full text-slate-400 text-sm py-2">Maybe later</button>
            <p class="text-center text-[10px] text-slate-400 mt-2"><i class="fas fa-lock mr-1"></i>Secure Kwacha payment · MTN, Airtel &amp; Zamtel</p>
        </div>
    </div>`;
    document.body.appendChild(ov);
}
function payWith(sku, amount, label) {
    const pw = $('paywall'); if (pw) pw.remove();
    const ov = document.createElement('div');
    ov.className='fixed inset-0 z-[90] bg-black/60 flex items-end justify-center';
    ov.id='payModal';
    ov.innerHTML = `<div class="bg-white w-full max-w-md rounded-t-3xl overflow-hidden fade-in">
        <div id="payS1">
            <div class="bg-zam-green text-white p-5"><h3 class="font-bold text-lg"><i class="fas fa-mobile-screen mr-2"></i>Mobile Money</h3><p class="text-emerald-100 text-sm mt-0.5">${label} · <b class="text-white">K${amount}</b></p></div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="text-sm font-semibold text-slate-600 block mb-2">Choose your network</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="pickNet('mtn',this)" class="net-btn border-2 rounded-xl p-3 text-center"><div class="bg-yellow-400 text-black font-extrabold text-xs rounded py-1 mb-1">MTN</div><span class="text-[11px] text-slate-500">MoMo</span></button>
                        <button onclick="pickNet('airtel',this)" class="net-btn border-2 rounded-xl p-3 text-center"><div class="bg-red-600 text-white font-extrabold text-xs rounded py-1 mb-1">Airtel</div><span class="text-[11px] text-slate-500">Money</span></button>
                        <button onclick="pickNet('zamtel',this)" class="net-btn border-2 rounded-xl p-3 text-center"><div class="bg-green-700 text-white font-extrabold text-xs rounded py-1 mb-1">Zamtel</div><span class="text-[11px] text-slate-500">Kwacha</span></button>
                    </div>
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-600 block mb-2">Mobile money number</label>
                    <div class="flex"><span class="bg-slate-100 border border-r-0 border-slate-300 rounded-l-xl px-3 flex items-center text-sm font-semibold text-slate-500">🇿🇲 +260</span>
                    <input id="payPhone" type="tel" maxlength="9" placeholder="97 1234567" class="flex-1 border border-slate-300 rounded-r-xl px-3 py-3 text-sm outline-none focus:ring-2 focus:ring-zam-green" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
                </div>
                <p id="payErr" class="text-zam-red text-sm font-semibold hidden"></p>
                <button onclick="submitPay('${sku}',${amount})" class="w-full bg-zam-green hover:bg-green-800 text-white font-bold py-3.5 rounded-xl">Send payment request <i class="fas fa-arrow-right ml-1"></i></button>
                <button onclick="this.closest('.fixed').remove()" class="w-full text-slate-400 text-sm py-1">Cancel</button>
            </div>
        </div>
        <div id="payS2" class="hidden p-8 text-center">
            <div class="spinner mx-auto"></div>
            <h3 class="font-bold text-lg mt-5">Check your phone 📲</h3>
            <p class="text-slate-500 text-sm mt-2">Enter your Mobile Money PIN to approve <b class="text-zam-green">K${amount}</b>.</p>
            <p class="text-xs text-slate-400 mt-3">Waiting for confirmation…</p>
        </div>
    </div>`;
    document.body.appendChild(ov);
}
let _net = null;
function pickNet(n, el) { _net=n; document.querySelectorAll('.net-btn').forEach(b=>b.style.borderColor=''); el.style.borderColor='#198a00'; }
async function submitPay(sku, amount) {
    const phone = ($('payPhone').value||'').trim();
    const err = $('payErr');
    if (!_net) { err.textContent='Please choose your network'; err.classList.remove('hidden'); return; }
    if (!/^(9|7)\d{8}$/.test(phone)) { err.textContent='Enter a valid 9-digit number (e.g. 97 1234567)'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    $('payS1').classList.add('hidden'); $('payS2').classList.remove('hidden');

    // Real money only: Premium unlocks solely on a server-confirmed payment.
    // No API configured, or payments not live yet → tell the user, unlock nothing.
    try {
        if (!CONFIG.API_BASE_URL) return payUnavailable();
        const base = CONFIG.API_BASE_URL.replace(/\/$/,'');
        const r = await fetch(base+'/api/pay', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone, network:_net, amount, item: sku }) });
        const d = await r.json();
        if (d.simulated) return payUnavailable();   // pawaPay token not set on the server
        // Poll status — unlock ONLY on server-confirmed success
        const txr = d.tx_ref;
        for (let i=0;i<20;i++) {
            await new Promise(x=>setTimeout(x,3000));
            const s = await (await fetch(base+'/api/pay/status?tx_ref='+encodeURIComponent(txr))).json();
            if (s.status==='successful') return finalizePay(sku, amount);
            if (s.status==='failed') return payFailed();
        }
        payFailed();
    } catch(e) { payFailed(); }
}
function payFailed() {
    const m = $('payModal'); if (m) m.remove();
    showToast('Payment not completed. Please try again.', 3000);
}
// Payments aren't live yet (no pawaPay merchant token on the server).
// We never grant Premium in this state — say so honestly instead.
function payUnavailable() {
    const m = $('payModal'); if (m) m.remove();
    showToast('Mobile Money payments are not live yet — nothing was charged. Please try again soon.', 4200);
}
function finalizePay(sku, amount) {
    unlockAfterPayment(sku);
    const m = $('payModal'); if (m) m.remove();
    // success flash
    const ov = document.createElement('div');
    ov.className='fixed inset-0 z-[95] bg-zam-green/95 flex flex-col items-center justify-center text-white fade-in';
    ov.innerHTML = `<div class="w-24 h-24 rounded-full bg-white flex items-center justify-center heart-pop"><i class="fas fa-check text-zam-green text-4xl"></i></div>
        <h2 class="text-2xl font-extrabold mt-5">Payment confirmed! 🎉</h2>
        <p class="text-emerald-50 mt-1">Your ${sku==='premium_month'?'Premium':''} feature is now unlocked.</p>`;
    document.body.appendChild(ov);
    setTimeout(()=>{ ov.remove(); renderHome(); }, 1800);
}
// Applies the purchased entitlement AFTER payment is verified.
function unlockAfterPayment(sku) {
    if (sku==='premium_month') {
        // One subscription unlocks everything for 30 days.
        me.premium = true;
        me.premiumUntil = Date.now() + 30*864e5;
        me.superLikes = 999;
        me.boostUntil = Date.now() + 30*864e5;
        DB.save('whoLiked', true);
    }
    saveMe();
}
function openBoost() { openPaywall(me.premium?'boost':'boost'); }

/* ================================================================
   ADMIN MODERATION QUEUE
   ================================================================ */
function renderAdmin(s) {
    const openReports = reports.filter(r=>r.type==='report');
    const verifs = reports.filter(r=>r.type==='verification');
    s.innerHTML = `
    <header class="px-5 pt-5 pb-3"><h1 class="text-2xl font-display font-extrabold"><i class="fas fa-shield-halved text-ember-deep mr-1"></i>Moderation</h1>
        <p class="text-slate-500 text-sm">Reports &amp; verification queue</p></header>
    <div class="flex-1 overflow-y-auto no-scrollbar px-4 pb-6 space-y-5">
        <div>
            <h3 class="font-bold text-sm text-slate-500 mb-2">⚠️ Reports (${openReports.filter(r=>r.status==='open').length} open)</h3>
            ${openReports.length===0?`<p class="text-slate-400 text-sm">No reports.</p>`:openReports.map((r,i)=>`
                <div class="bg-white rounded-xl p-3 mb-2 shadow-sm">
                    <div class="flex items-center justify-between"><span class="font-bold text-sm">${r.targetName}</span><span class="text-[10px] px-2 py-0.5 rounded-full ${r.status==='open'?'bg-red-100 text-red-600':'bg-green-100 text-green-600'}">${r.status}</span></div>
                    <p class="text-xs text-slate-500 mt-1">Reason: <b>${r.reason}</b></p>
                    ${r.status==='open'?`<div class="flex gap-2 mt-2"><button onclick="modAction(${reports.indexOf(r)},'ban')" class="flex-1 bg-red-500 text-white text-xs font-bold py-2 rounded-lg">Remove user</button><button onclick="modAction(${reports.indexOf(r)},'dismiss')" class="flex-1 bg-slate-100 text-slate-600 text-xs font-bold py-2 rounded-lg">Dismiss</button></div>`:''}
                </div>`).join('')}
        </div>
        <div>
            <h3 class="font-bold text-sm text-slate-500 mb-2">✓ Verifications (${verifs.filter(r=>r.status==='pending').length} pending)</h3>
            ${verifs.length===0?`<p class="text-slate-400 text-sm">No verification requests.</p>`:verifs.map(r=>`
                <div class="bg-white rounded-xl p-3 mb-2 shadow-sm flex items-center justify-between">
                    <span class="font-bold text-sm">${r.name}</span>
                    ${r.status==='pending'?`<div class="flex gap-2"><button onclick="modAction(${reports.indexOf(r)},'approve')" class="bg-green-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Approve</button><button onclick="modAction(${reports.indexOf(r)},'reject')" class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg">Reject</button></div>`:`<span class="text-[10px] px-2 py-0.5 rounded-full bg-green-100 text-green-600">${r.status}</span>`}
                </div>`).join('')}
        </div>
        <p class="text-[11px] text-slate-400 bg-cream rounded-xl p-3"><i class="fas fa-circle-info mr-1"></i>Demo queue (local). In production this reads Firestore <b>reports</b> &amp; <b>verifications</b>, protected by admin-only security rules.</p>
    </div>`;
}
function modAction(i, action) {
    const r = reports[i]; if (!r) return;
    if (action==='ban') { r.status='removed'; showToast('User removed'); }
    else if (action==='dismiss') { r.status='dismissed'; }
    else if (action==='approve') { r.status='approved'; if(r.userId===me.id){me.verified=true;me.verifyStatus='approved';saveMe();} }
    else if (action==='reject') { r.status='rejected'; if(r.userId===me.id){me.verifyStatus='rejected';saveMe();} }
    saveReports(); renderAdmin($('screen'));
}

/* ================================================================
   SERVICE WORKER
   ================================================================ */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

boot();
</script>
